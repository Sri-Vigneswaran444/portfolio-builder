services:
  - type: web
    name: portfolio-rag-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        value: ${GROQ_API_KEY}
      - key: PYTHON_VERSION
        value: 3.11